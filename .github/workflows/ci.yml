name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type check, lint, test, build
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build
        env:
          # The build does not query the database. A placeholder URL only
          # satisfies the import time check in src/db/index.ts. Sentry is off so
          # the build needs no auth token or source map upload.
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agentproof
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_SENTRY_DISABLED: "true"
